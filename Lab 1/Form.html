<!DOCTYPE HTML>
<html>
<Head>
<title>Student Form</title>
<link rel ="stylesheet" href ="style.css">
</head>

<body>
<form>
<div>
<label for="fullname">Full Name: </label>
<input type ="text" name="fullname" id="fullname" required>
</div>
<br>


<div>
<label for = "password">Password: </label>
<input type="password"name="password" id="password" required>
</div><br>



<div>
    <label for="dob">Date of Birth: </label>
    <input type="date" name="dob" id="dob" required>
</div>
<br>


<div>
    <label for="image">Upload Image: </label>
    <input type="file" name="image" id="image" accept="image/*">
</div>
<br>


<div>
    <label>Gender: </label>
    <input type="radio" name="gender" id="male" value="Male">
    <label for="male">Male</label>

    <input type="radio" name="gender" id="female" value="Female">
    <label for="female">Female</label>

</div>
<br>


<div>
    <label>Religion: </label>
    <input type="checkbox" name="religion" id="islam" value="Islam">Islam

    <input type="checkbox" name="religion" id="hinduism" value="Hinduism">Hinduism

<br>

<div>
    <label for="department">Department: </label>
    <select name="department" id="department" required>
        <option value="CSE"selected>CSE </option>
        <option value="EEE">EEE</option>
        <option value="BBA">BBA</option>
    </select>
</div>

<br>
<div>
<label for="address">Write down the address: </label>
<textarea col= "5" rows = "10"></textarea>
</div>
<br>

<div>
<input type="submit" value="Submit Registration">
<input type="reset"value="clear">


</form>
</body>









</html>
